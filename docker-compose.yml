services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - fraud-detection
    restart: unless-stopped
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:19092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - fraud-detection
    restart: unless-stopped

  mlflow:
    image: python:3.11-slim
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
      - ./mlartifacts:/mlflow/mlartifacts
      - .:/mlflow/data
    working_dir: /mlflow
    command:
      - bash
      - -c
      - |
        pip install -q mlflow==2.10.0 psycopg2-binary &&
        python3 << 'PYTHON_SCRIPT'
        import fileinput
        import sys
        mlflow_file = "/usr/local/lib/python3.11/site-packages/mlflow/server/__init__.py"
        for line in fileinput.input(mlflow_file, inplace=True):
            if 'bind_address = f"127.0.0.1:{port}"' in line:
                print('    bind_address = f"{host}:{port}"')
            else:
                print(line, end='')
        PYTHON_SCRIPT
        exec mlflow server \
          --backend-store-uri sqlite:////mlflow/data/mlflow.db \
          --default-artifact-root /mlflow/mlartifacts \
          --host 0.0.0.0 \
          --port 5000
    environment:
      - MLFLOW_TRACKING_URI=http://10.107.101.128:5000
      - BACKEND_STORE_URI=sqlite:////mlflow/data/mlflow.db
      - DEFAULT_ARTIFACT_ROOT=/mlflow/mlartifacts
      - MLFLOW_HOST=0.0.0.0
    networks:
      - fraud-detection
    restart: unless-stopped

  streamlit:
    image: python:3.11-slim
    container_name: streamlit-app
    ports:
      - "8501:8501"
    volumes:
      - ./streamlit_app.py:/app/streamlit_app.py
      - ./streamlit_requirements.txt:/app/streamlit_requirements.txt
    working_dir: /app
    command:
      - bash
      - -c
      - |
        pip install -q -r streamlit_requirements.txt &&
        exec streamlit run streamlit_app.py \
          --server.port=8501 \
          --server.address=0.0.0.0 \
          --server.headless=true
    environment:
      - BACKEND_URL=http://host.docker.internal:8000
    networks:
      - fraud-detection
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - fraud-detection
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - fraud-detection
    restart: unless-stopped
    depends_on:
      - prometheus

  jmx-exporter:
    image: bitnami/jmx-exporter:latest
    container_name: jmx-exporter
    ports:
      - "5556:5556"
    volumes:
      - ./monitoring/jmx-exporter-config.yml:/etc/jmx-exporter/config.yml
    command:
      - "5556"
      - "/etc/jmx-exporter/config.yml"
    networks:
      - fraud-detection
    restart: unless-stopped

  pinot-controller:
    image: apachepinot/pinot:latest
    container_name: pinot-controller
    command: StartController -zkAddress zookeeper:2181
    environment:
      JAVA_OPTS: "-Xms512M -Xmx1G"
    ports:
      - "9000:9000"
    networks:
      - fraud-detection
    depends_on:
      - zookeeper
    restart: unless-stopped
    volumes:
      - pinot-controller-data:/opt/pinot/data
      - pinot-controller-config:/opt/pinot/configs

  pinot-broker:
    image: apachepinot/pinot:latest
    container_name: pinot-broker
    command: StartBroker -zkAddress zookeeper:2181
    environment:
      JAVA_OPTS: "-Xms512M -Xmx1G"
    ports:
      - "8099:8099"
    networks:
      - fraud-detection
    depends_on:
      - pinot-controller
    restart: unless-stopped
    volumes:
      - pinot-broker-data:/opt/pinot/data
      - pinot-broker-config:/opt/pinot/configs

  pinot-server:
    image: apachepinot/pinot:latest
    container_name: pinot-server
    command: StartServer -zkAddress zookeeper:2181
    environment:
      JAVA_OPTS: "-Xms512M -Xmx1G"
    networks:
      - fraud-detection
    depends_on:
      - pinot-broker
    restart: unless-stopped
    volumes:
      - pinot-server-data:/opt/pinot/data
      - pinot-server-config:/opt/pinot/configs
      - ./segments:/segments

  postgres:
    image: postgres:15
    container_name: postgres-fraud
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fraud_detection
    ports:
      - "5432:5432"
    networks:
      - fraud-detection
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

networks:
  fraud-detection:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  pinot-controller-data:
  pinot-controller-config:
  pinot-broker-data:
  pinot-broker-config:
  pinot-server-data:
  pinot-server-config:
  postgres-data:
  zookeeper-data:
  zookeeper-logs:
